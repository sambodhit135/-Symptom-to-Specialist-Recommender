[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    "venv*",
    ".venv*",
    "env*",
    "ci_test_env*",
    "__pycache__",
    "mlruns",
    "mlartifacts",
    "data/raw",
    "data/processed",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # Line too long (handled by formatter / long docstrings)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
