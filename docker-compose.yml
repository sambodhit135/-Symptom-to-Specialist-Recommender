# =============================================================================
# docker-compose.yml – Disease Prediction MLOps Stack
# =============================================================================
# Services:
#   frontend    - nginx static UI + /api/ reverse proxy  (port 8080) [core, full]
#   api         - FastAPI prediction service            (port 8000) [core, full]
#   mlflow      - MLflow tracking server                (port 5000) [core, full]
#   prometheus  - Prometheus metrics scraper            (port 9090) [monitoring, full]
#   grafana     - Grafana metrics dashboards            (port 3000) [monitoring, full]
#
# Compose Profiles:
#   core        - frontend, api, mlflow (~2.6 GB RAM)
#   monitoring  - prometheus, grafana (~235 MB RAM)
#   full        - all 5 services (~2.85 GB RAM)
#
# Usage:
#   docker compose build                         # build service images
#   docker compose up -d                         # start default profile (from .env)
#   docker compose --profile core up -d          # start lightweight core stack
#   docker compose --profile full up -d          # start complete stack
#   docker compose ps                            # check health status
#   docker compose down                          # stop services (preserves data)
#   docker compose down -v                       # stop and purge named volumes
# =============================================================================

services:

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    profiles: ["core", "full"]
    image: diseasepredictionusingmachinelearning-api
    container_name: mlflow-server
    user: "0:0"
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_URI:-sqlite:////mlflow_data/mlflow.db}
      --host 0.0.0.0
      --port 5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - app-net

  # ── Prediction API ─────────────────────────────────────────────────────────
  api:
    profiles: ["core", "full"]
    build:
      context: .
      dockerfile: Dockerfile
    image: diseasepredictionusingmachinelearning-api
    container_name: disease-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - FEEDBACK_DIR=${FEEDBACK_DIR:-/app/data/feedback}
      - PROD_LOGS_DIR=${PROD_LOGS_DIR:-/app/data/prod_logs}
      - MLFLOW_DISABLE_AGENT_HINT=1
    volumes:
      - feedback_data:/app/data/feedback
      - prod_logs_data:/app/data/prod_logs
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - app-net

  # ── Frontend (nginx: static files + /api/ reverse proxy) ─────────────────
  frontend:
    profiles: ["core", "full"]
    image: nginx:1.27-alpine
    container_name: disease-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # Static files served by nginx
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
      # nginx configuration (proxies /api/ → api:8000)
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - app-net

  # ── Prometheus Monitoring ──────────────────────────────────────────────────
  prometheus:
    profiles: ["monitoring", "full"]
    image: prom/prometheus:v2.51.0
    container_name: prometheus-monitoring
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - app-net

  # ── Grafana Dashboards ─────────────────────────────────────────────────────
  grafana:
    profiles: ["monitoring", "full"]
    image: grafana/grafana:10.4.0
    container_name: grafana-dashboards
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - app-net

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  mlflow_data:
    driver: local
  feedback_data:
    driver: local
  prod_logs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
