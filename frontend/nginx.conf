# frontend/nginx.conf
# ===========================================================================
# nginx configuration for the Disease Prediction frontend service.
#
# Responsibilities:
#   1. Serve static files (index.html, style.css, app.js) from /usr/share/nginx/html
#   2. Proxy all requests whose path starts with /api/ to the FastAPI container,
#      stripping the /api prefix so the API sees its own paths (/health, /predict…)
#
# No CORS wildcards are needed on the API because the browser talks to nginx
# on the same origin (http://localhost:8080).
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Root: serve static frontend files ───────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve any static asset that exists; fall back to index.html (SPA-style)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── /api/ proxy → FastAPI (strip the /api prefix) ───────────────────────
    # Example:  GET /api/health  →  GET http://api:8000/health
    location /api/ {
        # Strip the leading /api prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        # Forward client information headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Reasonable timeouts for ML inference (model can take a moment)
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression for text assets ────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 256;
}
